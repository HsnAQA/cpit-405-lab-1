<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CPIT-405 Lab 1</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, Arial, Helvetica, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        display: grid;
        min-height: 100dvh;
        margin: 0;
        padding: clamp(1rem, 4vw, 3rem);
        place-items: center;
        overflow-x: hidden;
        overflow-y: auto;
        background: #f5f7f9;
        color: #17233a;
      }

      main {
        position: relative;
        width: min(100%, 760px);
        padding: clamp(1.5rem, 7vw, 3.25rem);
        border: 1px solid #d8e0e8;
        border-top: 5px solid #1f5f86;
        border-radius: 0.75rem;
        background: #ffffff;
        box-shadow: 0 12px 28px rgb(25 45 70 / 8%);
        text-align: left;
      }

      .label {
        display: inline-block;
        margin: 0 0 1.25rem;
        color: #1f5f86;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .identity {
        border-left: 4px solid #f0c94f;
        padding-left: clamp(1rem, 3vw, 1.5rem);
      }

      h1 {
        margin: 0;
        color: #17233a;
        font-size: clamp(2.15rem, 9vw, 3.5rem);
        letter-spacing: -0.04em;
        line-height: 1.02;
        overflow-wrap: anywhere;
      }

      p {
        margin: 0.35rem 0 0;
        color: #52637a;
        font-size: clamp(1rem, 3.8vw, 1.05rem);
        line-height: 1.55;
        overflow-wrap: anywhere;
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-top: clamp(2rem, 5vw, 3.25rem);
        padding-top: 1.25rem;
        border-top: 1px solid #d8e0e8;
        color: #52637a;
        font-size: 0.9rem;
      }

      .footer a {
        color: #1f5f86;
        font-weight: 700;
        text-decoration-thickness: 2px;
        text-underline-offset: 0.2em;
      }

      @media (max-width: 500px) {
        .identity {
          padding-left: 1rem;
        }

        .footer {
          align-items: flex-start;
          flex-direction: column;
        }
      }

      @media (max-width: 360px) {
        body {
          padding: 0.75rem;
        }

        .label {
          font-size: 0.7rem;
          letter-spacing: 0.08em;
        }

      }

      @media (max-height: 560px) and (min-width: 501px) {
        body {
          place-items: start center;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">CPIT-405 · Lab 01</p>
      <section class="identity" aria-label="Student profile">
        <div>
          <h1>Hassan Asiri</h1>
          <p>Internet Applications</p>
        </div>
      </section>
      <div class="footer">
        <span>Development environment setup</span>
        <a href="https://github.com/HsnAQA/cpit-405-lab-1">View repository</a>
      </div>
    </main>
  </body>
</html>
